<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Toolkit for Udemy</title>
<link rel="stylesheet" href="pages.css">
</head>
<body class="popup">
<div class="pop">
  <div class="row"><h1>Toolkit for Udemy</h1><span class="grow"></span><span class="muted" id="ver"></span></div>

  <div class="box" id="today">
    <div class="row"><b>Today</b><span class="grow"></span><span id="today-txt" class="muted"></span></div>
    <div class="meter"><i id="today-bar" style="width:0%"></i></div>
    <div class="muted" id="streak"></div>
  </div>

  <div class="box" id="tab-box" hidden>
    <div class="muted" id="tab-lecture"></div>
    <div class="speed-row" style="margin-top:6px">
      <button data-act="speedDown" aria-label="Slower">−</button><b id="tab-speed">1x</b><button data-act="speedUp" aria-label="Faster">+</button>
      <span class="grow"></span><button data-act="subs">Dual Subs</button><button data-act="note">Note</button>
    </div>
    <div class="muted" id="tab-remain" style="margin-top:6px"></div>
  </div>

  <div class="box">
    <label class="toggle"><span>Dual subtitles</span><input type="checkbox" data-k="subs.enabled"></label>
    <label class="toggle"><span>Hide owned courses in search &amp; lists</span><input type="checkbox" data-k="catalog.hideOwned"></label>
    <label class="toggle"><span>Toolbar below video</span><input type="checkbox" data-k="player.toolbar"></label>
    <label class="toggle"><span>Dark mode (experimental)</span><input type="checkbox" data-k="ui.darkMode"></label>
  </div>

  <div class="btns">
    <button id="open-lib" class="primary">Open My Learning</button>
    <button id="open-opt">Settings</button>
    <button id="open-sent">Saved Sentences</button>
    <button id="open-stats">Study Stats</button>
    <button id="diag" title="Checks whether a Udemy page change broke a feature">Check Page Structure</button>
  </div>

  <div class="box" id="diag-box" hidden>
    <pre id="diag-out" aria-live="polite"></pre>
    <div class="muted" id="diag-hint" aria-live="polite"></div>
    <button id="diag-copy">Copy Result</button>
  </div>
</div>
<script src="../lib/common.js"></script>
<script src="popup.js"></script>
</body>
</html>
